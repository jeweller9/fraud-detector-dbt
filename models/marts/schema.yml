version: 2

models:
  - name: mart_daily_state_metrics
    description: "Дневные метрики по штатам."
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: us_state
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [transaction_date, us_state]

  - name: mart_fraud_by_category
    description: "Анализ фрода по категориям."
    columns:
      - name: cat_id
        tests: [not_null, unique]
      - name: fraud_rate_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_fraud_by_state
    description: "Географический анализ фрода."
    columns:
      - name: us_state
        tests: [not_null, unique]
      - name: fraud_rate_pct
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_customer_risk_profile
    description: "Профиль риска клиентов."
    columns:
      - name: customer_full_name
        tests: [not_null]
      - name: risk_level
        tests:
          - accepted_values:
              arguments:
                values: ['HIGH', 'MEDIUM', 'LOW']
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_full_name, us_state]

  - name: mart_hourly_fraud_pattern
    description: "Временные паттерны фрода."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [day_of_week, transaction_hour]

  - name: mart_merchant_analytics
    description: "Аналитика по мерчантам."
    columns:
      - name: merch
        tests: [not_null, unique]
      - name: is_suspicious
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
